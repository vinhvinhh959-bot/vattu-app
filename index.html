<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản lý vật tư tưới</title><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6b3a"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f2f6f0;--card:#fff;--ink:#14261a;--mut:#62736a;--pri:#1f6b3a;--pri2:#dcefe1;--line:#d9e3d8;--red:#b3261e;--amb:#c07a00;--blue:#2b6fb5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1611;--card:#17211a;--ink:#e6efe8;--mut:#91a398;--pri:#5cbb7b;--pri2:#1d3324;--line:#29392e;--red:#ff8a80;--amb:#ffb74d;--blue:#6fb0f0}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;max-width:800px;margin:auto}
h1{font-size:19px;margin:0}#act{display:flex;gap:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 0 6px;font:inherit;font-size:11px}
nav button b{display:block;font-size:18px;font-weight:400;line-height:1.2}nav button.on{color:var(--pri);font-weight:700}
main{padding:0 14px;max-width:800px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:13px}
input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
button{font:inherit;cursor:pointer}
.b{background:var(--pri);color:var(--card);border:0;border-radius:8px;padding:9px 13px;font-weight:600;white-space:nowrap}
.g{background:var(--pri2);color:var(--pri)}.r{background:none;border:0;color:var(--red);padding:6px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:13px}
.chips button.on{background:var(--pri);color:var(--card);border-color:var(--pri)}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 14px 100px;z-index:20}
.ov>*{max-width:800px;margin-left:auto;margin-right:auto}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:21}
.q{width:70px;text-align:center}.pr{width:110px;text-align:right}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.kpi .card{margin:0}.kpi b{display:block;font-size:17px}
.neg{color:var(--red)}.bar{height:6px;border-radius:3px;background:var(--pri);margin:3px 0 9px}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-bottom:4px}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
@media print{nav,header,.foot,.noprt{display:none!important}.ov{position:static;padding:0}body{background:#fff;color:#000}}
</style></head><body>
<header><h1 id="ttl"></h1><div id="act"></div></header><main id="v"></main><nav id="nav"></nav><div id="modal" class="ov" hidden></div>
<script src="products.js"></script><script src="app.js"></script></body></html>
