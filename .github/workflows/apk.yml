name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chuẩn bị Capacitor
        run: |
          mkdir www
          cp index.html app.js products.js sw.js manifest.webmanifest icon.svg www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Vat tu tuoi" com.vattu.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - name: Đăng APK lên Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bản APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
